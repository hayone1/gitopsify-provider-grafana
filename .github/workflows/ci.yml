name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Until the SDK has tagged releases, build against gitopsify's checkout
      # (go.mod replaces the SDK with ../gitopsify/sdk).
      - uses: actions/checkout@v4
        with:
          repository: hayone1/gitopsify
          path: _gitopsify
          token: ${{ secrets.GITOPSIFY_READ_TOKEN || github.token }}
      - run: mv _gitopsify ../gitopsify
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint test build
